name: flutter_dev_panel
description: "A comprehensive Flutter debug panel for development with network monitoring, performance tracking, and environment switching."
version: 1.1.3
homepage: https://github.com/royorange/flutter-dev-panel
# publish_to: none  # 注释掉以允许发布

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies (移自 flutter_dev_panel_core)
  sensors_plus: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  
  # Module packages - 作为独立包发布
  # 用户需要单独添加所需的模块
  # flutter_dev_panel_console: ^1.0.0
  # flutter_dev_panel_network: ^1.0.0
  # flutter_dev_panel_device: ^1.0.0
  # flutter_dev_panel_performance: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  melos: ^6.3.3
  dio: ^5.4.0

flutter:
