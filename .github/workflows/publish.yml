name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'console-v*'
      - 'device-v*'
      - 'network-v*'
      - 'performance-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - flutter_dev_panel
          - flutter_dev_panel_console
          - flutter_dev_panel_network
          - flutter_dev_panel_device
          - flutter_dev_panel_performance
          - all
      dry_run:
        description: 'Dry run only'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Setup Pub Credentials
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json

      - name: Determine package to publish
        id: determine_package
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Extract package name from tag
            TAG="${{ github.ref_name }}"

            # Map tags to full package names
            case $TAG in
              v*)
                PACKAGE="flutter_dev_panel"
                ;;
              console-v*)
                PACKAGE="flutter_dev_panel_console"
                ;;
              network-v*)
                PACKAGE="flutter_dev_panel_network"
                ;;
              device-v*)
                PACKAGE="flutter_dev_panel_device"
                ;;
              performance-v*)
                PACKAGE="flutter_dev_panel_performance"
                ;;
              *)
                echo "Unknown tag format: $TAG"
                exit 1
                ;;
            esac
          else
            # Use workflow_dispatch input
            PACKAGE="${{ github.event.inputs.package }}"
          fi
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Publish main package
        if: steps.determine_package.outputs.package == 'flutter_dev_panel' || steps.determine_package.outputs.package == 'all'
        run: |
          echo "Publishing flutter_dev_panel..."
          # Remove example directory to avoid dependency conflicts
          rm -rf example
          # Skip tests in CI since they cause dependency issues
          # Tests are already run in development and pre-commit
          echo "Skipping tests in CI due to monorepo structure"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            flutter pub publish --dry-run
          else
            flutter pub publish --force
          fi

      - name: Publish Sub-packages
        if: |
          steps.determine_package.outputs.package == 'flutter_dev_panel_console' ||
          steps.determine_package.outputs.package == 'flutter_dev_panel_network' ||
          steps.determine_package.outputs.package == 'flutter_dev_panel_device' ||
          steps.determine_package.outputs.package == 'flutter_dev_panel_performance' ||
          steps.determine_package.outputs.package == 'all'
        run: |
          REPO_ROOT=$(pwd)
          MAIN_VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          PACKAGE="${{ steps.determine_package.outputs.package }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # Publish a sub-package via a temporary standalone git repo.
          # dart pub publish uses 'git ls-files' to build the archive. When the
          # git root differs from the package root (monorepo), the archive is
          # empty (<1 KB). Copying into a fresh git repo fixes this.
          publish_sub() {
            local name=$1
            local dir="$REPO_ROOT/packages/$name"

            if [ "$PACKAGE" != "$name" ] && [ "$PACKAGE" != "all" ]; then
              return
            fi

            echo "Publishing $name..."
            local tmp_dir=$(mktemp -d)
            cp -r "$dir"/. "$tmp_dir/"

            # Replace path dependency with hosted version
            awk -v ver="^$MAIN_VERSION" '
            /flutter_dev_panel:$/ {
                getline next_line
                if (next_line ~ /path: \.\.\/\.\./) {
                    print $0 " " ver
                } else {
                    print
                    print next_line
                }
                next
            }
            { print }
            ' "$tmp_dir/pubspec.yaml" > "$tmp_dir/pubspec.yaml.tmp"
            mv "$tmp_dir/pubspec.yaml.tmp" "$tmp_dir/pubspec.yaml"

            sed -i '/publish_to: none/d' "$tmp_dir/pubspec.yaml"
            rm -f "$tmp_dir/pubspec_overrides.yaml"
            cp "$REPO_ROOT/LICENSE" "$tmp_dir/LICENSE" 2>/dev/null || true

            echo "Updated pubspec.yaml:"
            head -20 "$tmp_dir/pubspec.yaml"

            (cd "$tmp_dir" && git init && git add -A && git commit -m "publish" --quiet)

            if [ "$DRY_RUN" == "true" ]; then
              (cd "$tmp_dir" && flutter pub publish --dry-run)
            else
              (cd "$tmp_dir" && flutter pub publish --force)
            fi
            local exit_code=$?

            rm -rf "$tmp_dir"
            return $exit_code
          }

          publish_sub "flutter_dev_panel_console"
          publish_sub "flutter_dev_panel_network"
          publish_sub "flutter_dev_panel_device"
          publish_sub "flutter_dev_panel_performance"
