name: Melos Workflow

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - test              # Run tests only
          - analyze           # Run analysis only
          - version           # Version packages and create tags
          - publish           # Publish packages to pub.dev
          - version-publish   # Version and publish in one go
      version_type:
        description: 'Version type (for version actions)'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto              # Based on conventional commits
          - patch             # 1.0.0 -> 1.0.1
          - minor             # 1.0.0 -> 1.1.0
          - major             # 1.0.0 -> 2.0.0
          - graduate          # 1.0.0-dev.1 -> 1.0.0
      prerelease:
        description: 'Create prerelease version'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (simulate without making changes)'
        required: false
        type: boolean
        default: false
      publish_main:
        description: 'Publish flutter_dev_panel (main package)'
        required: false
        type: boolean
        default: true
      publish_console:
        description: 'Publish flutter_dev_panel_console'
        required: false
        type: boolean
        default: true
      publish_network:
        description: 'Publish flutter_dev_panel_network'
        required: false
        type: boolean
        default: true
      publish_device:
        description: 'Publish flutter_dev_panel_device'
        required: false
        type: boolean
        default: true
      publish_performance:
        description: 'Publish flutter_dev_panel_performance'
        required: false
        type: boolean
        default: true

jobs:
  melos:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for analyzing commit history
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Install Dependencies
        run: |
          flutter pub get
          dart pub global activate melos
          export PATH="$PATH:$HOME/.pub-cache/bin"
      
      - name: Bootstrap Packages
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos bootstrap
      
      # Test Action
      - name: Run Tests
        if: github.event.inputs.action == 'test'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos run test --no-select
      
      # Analyze Action
      - name: Run Analysis
        if: github.event.inputs.action == 'analyze'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos run analyze --no-select
      
      # Version Action
      - name: Version Packages
        if: |
          (github.event.inputs.action == 'version' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          
          # Build version command based on inputs
          VERSION_CMD="dart run melos version"
          
          # Handle version type
          if [ "${{ github.event.inputs.version_type }}" == "graduate" ]; then
            VERSION_CMD="$VERSION_CMD --graduate"
          elif [ "${{ github.event.inputs.version_type }}" != "auto" ]; then
            # Manual version for all packages
            TYPE="${{ github.event.inputs.version_type }}"
            VERSION_CMD="$VERSION_CMD"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_console:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_network:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_device:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_performance:$TYPE"
          fi
          
          # Add prerelease flag if needed
          if [ "${{ github.event.inputs.prerelease }}" == "true" ] && [ "${{ github.event.inputs.version_type }}" != "graduate" ]; then
            VERSION_CMD="$VERSION_CMD --prerelease"
          fi
          
          # Execute version command
          $VERSION_CMD --yes
          
          # Create short tags (v1.0.0, console-v1.0.0, etc)
          echo "Creating short tags..."
          for tag in $(git tag --points-at HEAD); do
            if [[ $tag == flutter_dev_panel-v* ]]; then
              # Main package: flutter_dev_panel-v1.0.0 -> v1.0.0
              short_tag=${tag#flutter_dev_panel-}
              git tag $short_tag
              echo "Created tag: $short_tag"
            elif [[ $tag == flutter_dev_panel_*-v* ]]; then
              # Sub packages: flutter_dev_panel_console-v1.0.0 -> console-v1.0.0
              short_tag=${tag#flutter_dev_panel_}
              git tag $short_tag
              echo "Created tag: $short_tag"
            fi
          done
      
      - name: Push Changes
        if: |
          (github.event.inputs.action == 'version' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          git push
          git push --tags
      
      # Publish Action
      - name: Setup Pub Credentials
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json
      
      - name: Dry Run Info
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN MODE - No actual changes will be made"
          export PATH="$PATH:$HOME/.pub-cache/bin"
          
          if [[ "${{ github.event.inputs.action }}" == *"version"* ]]; then
            echo "Would version packages based on:"
            echo "  - Version type: ${{ github.event.inputs.version_type }}"
            echo "  - Prerelease: ${{ github.event.inputs.prerelease }}"
            echo ""
            echo "Current versions:"
            dart run melos list --long
          fi
          
          if [[ "${{ github.event.inputs.action }}" == *"publish"* ]]; then
            echo ""
            echo "Would publish the following packages:"
            dart run melos publish --dry-run --yes
          fi
      
      - name: Prepare for Publishing  
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          # 关键：删除所有 pubspec_overrides.yaml 文件
          # Melos 3.0+ 使用这些文件管理本地依赖，但发布时必须删除
          echo "Removing pubspec_overrides.yaml files..."
          find . -name "pubspec_overrides.yaml" -type f -delete
      
      - name: Publish Packages
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          
          # 获取所有包的版本
          MAIN_VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          echo "Main package version to publish: $MAIN_VERSION"
          
          # 发布主包（如果用户选择了）
          if [ "${{ github.event.inputs.publish_main }}" = "true" ]; then
            echo "\n📦 Processing main package flutter_dev_panel..."
            
            # 检查 pub.dev 上的最新版本
            PUBLISHED_VERSION=$(curl -s "https://pub.dev/api/packages/flutter_dev_panel" | grep -o '"latest":{"version":"[^"]*' | cut -d'"' -f6 || echo "0.0.0")
            echo "Latest version on pub.dev: $PUBLISHED_VERSION"
            
            if [ "$PUBLISHED_VERSION" != "$MAIN_VERSION" ]; then
              echo "📦 Publishing main package flutter_dev_panel $MAIN_VERSION..."
              dart pub publish --force || echo "⚠️ Failed to publish main package (may already be published)"
              echo "Waiting for main package to be available on pub.dev..."
              sleep 10
            else
              echo "✅ Main package flutter_dev_panel $MAIN_VERSION is already published"
            fi
          else
            echo "⏭️ Skipping main package (not selected)"
          fi
          
          # 发布子包（根据用户选择）
          publish_subpackage() {
            local package_name=$1
            local input_var=$2
            
            if [ "$input_var" = "true" ]; then
              echo "\n📦 Processing $package_name..."
              
              if [ -d "packages/$package_name" ]; then
                cd "packages/$package_name"
                
                # 获取包版本
                PACKAGE_VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
                echo "Package version: $PACKAGE_VERSION"
                
                # 检查是否已发布
                PUBLISHED_PKG_VERSION=$(curl -s "https://pub.dev/api/packages/$package_name" | grep -o '"latest":{"version":"[^"]*' | cut -d'"' -f6 || echo "0.0.0")
                
                if [ "$PUBLISHED_PKG_VERSION" = "$PACKAGE_VERSION" ]; then
                  echo "✅ $package_name $PACKAGE_VERSION is already published"
                else
                  # 更新依赖到已发布的主包版本
                  echo "Updating dependency to flutter_dev_panel: ^$MAIN_VERSION"
                  cp pubspec.yaml pubspec.yaml.bak
                  
                  # 检查主包版本是否已在 pub.dev 上
                  MAIN_PUB_VERSION=$(curl -s "https://pub.dev/api/packages/flutter_dev_panel" | grep -o '"latest":{"version":"[^"]*' | cut -d'"' -f6 || echo "0.0.0")
                  if [ "$MAIN_PUB_VERSION" = "$MAIN_VERSION" ]; then
                    DEPENDENCY_VERSION=$MAIN_VERSION
                  else
                    echo "⚠️ Main package $MAIN_VERSION not yet on pub.dev, using $MAIN_PUB_VERSION"
                    DEPENDENCY_VERSION=$MAIN_PUB_VERSION
                  fi
                  
                  sed "s|flutter_dev_panel:.*|flutter_dev_panel: ^$DEPENDENCY_VERSION|g" pubspec.yaml.bak | grep -v "path:" > pubspec.yaml
                  
                  echo "📦 Publishing $package_name $PACKAGE_VERSION..."
                  dart pub publish --force || echo "⚠️ Failed to publish $package_name"
                  
                  # 恢复原始文件
                  mv pubspec.yaml.bak pubspec.yaml
                fi
                
                cd ../..
              else
                echo "⚠️ Package directory packages/$package_name not found"
              fi
            else
              echo "⏭️ Skipping $package_name (not selected)"
            fi
          }
          
          # 发布各个子包
          publish_subpackage "flutter_dev_panel_console" "${{ github.event.inputs.publish_console }}"
          publish_subpackage "flutter_dev_panel_network" "${{ github.event.inputs.publish_network }}"
          publish_subpackage "flutter_dev_panel_device" "${{ github.event.inputs.publish_device }}"
          publish_subpackage "flutter_dev_panel_performance" "${{ github.event.inputs.publish_performance }}"
          
          echo ""
          echo "🎉 Publishing process completed!"
      
      # Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## 📊 Melos Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "**Mode:** 🔍 Dry Run (no changes made)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** ✅ Live Run" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.action }}" == *"version"* ]]; then
            echo "### Version Settings" >> $GITHUB_STEP_SUMMARY
            echo "- **Type:** ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Prerelease:** ${{ github.event.inputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Package Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos list --long >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "version" ] || [ "${{ github.event.inputs.action }}" == "version-publish" ]; then
            if [ "${{ github.event.inputs.dry_run }}" == "false" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Created Tags" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              git tag --points-at HEAD >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi