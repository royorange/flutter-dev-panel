name: Melos Workflow

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - test              # Run tests only
          - analyze           # Run analysis only
          - version           # Version packages and create tags
          - publish           # Publish packages to pub.dev
          - version-publish   # Version and publish in one go
      version_type:
        description: 'Version type (for version actions)'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto              # Based on conventional commits
          - patch             # 1.0.0 -> 1.0.1
          - minor             # 1.0.0 -> 1.1.0
          - major             # 1.0.0 -> 2.0.0
          - graduate          # 1.0.0-dev.1 -> 1.0.0
      prerelease:
        description: 'Create prerelease version'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (simulate without making changes)'
        required: false
        type: boolean
        default: false
      publish_main:
        description: 'Publish flutter_dev_panel (main package)'
        required: false
        type: boolean
        default: true
      publish_console:
        description: 'Publish flutter_dev_panel_console'
        required: false
        type: boolean
        default: true
      publish_network:
        description: 'Publish flutter_dev_panel_network'
        required: false
        type: boolean
        default: true
      publish_device:
        description: 'Publish flutter_dev_panel_device'
        required: false
        type: boolean
        default: true
      publish_performance:
        description: 'Publish flutter_dev_panel_performance'
        required: false
        type: boolean
        default: true

jobs:
  melos:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for analyzing commit history
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Install Dependencies
        run: |
          flutter pub get
          dart pub global activate melos
          export PATH="$PATH:$HOME/.pub-cache/bin"
      
      - name: Bootstrap Packages
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos bootstrap
      
      # Test Action
      - name: Run Tests
        if: github.event.inputs.action == 'test'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos run test --no-select
      
      # Analyze Action
      - name: Run Analysis
        if: github.event.inputs.action == 'analyze'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos run analyze --no-select
      
      # Version Action
      - name: Version Packages
        if: |
          (github.event.inputs.action == 'version' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          
          # Build version command based on inputs
          VERSION_CMD="dart run melos version"
          
          # Handle version type
          if [ "${{ github.event.inputs.version_type }}" == "graduate" ]; then
            VERSION_CMD="$VERSION_CMD --graduate"
          elif [ "${{ github.event.inputs.version_type }}" != "auto" ]; then
            # Manual version for all packages
            TYPE="${{ github.event.inputs.version_type }}"
            VERSION_CMD="$VERSION_CMD"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_console:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_network:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_device:$TYPE"
            VERSION_CMD="$VERSION_CMD --manual-version flutter_dev_panel_performance:$TYPE"
          fi
          
          # Add prerelease flag if needed
          if [ "${{ github.event.inputs.prerelease }}" == "true" ] && [ "${{ github.event.inputs.version_type }}" != "graduate" ]; then
            VERSION_CMD="$VERSION_CMD --prerelease"
          fi
          
          # Execute version command
          $VERSION_CMD --yes
          
          # Create short tags (v1.0.0, console-v1.0.0, etc)
          echo "Creating short tags..."
          for tag in $(git tag --points-at HEAD); do
            if [[ $tag == flutter_dev_panel-v* ]]; then
              # Main package: flutter_dev_panel-v1.0.0 -> v1.0.0
              short_tag=${tag#flutter_dev_panel-}
              git tag $short_tag
              echo "Created tag: $short_tag"
            elif [[ $tag == flutter_dev_panel_*-v* ]]; then
              # Sub packages: flutter_dev_panel_console-v1.0.0 -> console-v1.0.0
              short_tag=${tag#flutter_dev_panel_}
              git tag $short_tag
              echo "Created tag: $short_tag"
            fi
          done
      
      - name: Push Changes
        if: |
          (github.event.inputs.action == 'version' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          git push
          git push --tags
      
      # Publish Action
      - name: Setup Pub Credentials
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json
      
      - name: Dry Run Info
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN MODE - No actual changes will be made"
          export PATH="$PATH:$HOME/.pub-cache/bin"

          if [[ "${{ github.event.inputs.action }}" == *"version"* ]]; then
            echo "Would version packages based on:"
            echo "  - Version type: ${{ github.event.inputs.version_type }}"
            echo "  - Prerelease: ${{ github.event.inputs.prerelease }}"
            echo ""
            echo "Current versions:"
            dart run melos list --long
          fi

          if [[ "${{ github.event.inputs.action }}" == *"publish"* ]]; then
            echo ""
            echo "Validating main package (dry-run)..."
            # Only dry-run the main package. Sub-packages depend on the main
            # package which is not yet on pub.dev, so their dry-run will always
            # fail with dependency resolution errors. The real publish flow
            # handles this by publishing the main package first, then sub-packages.
            dart pub publish --dry-run

            echo ""
            echo "Packages that would be published:"
            dart run melos list --long
          fi
      
      - name: Prepare for Publishing  
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          # 关键：删除所有 pubspec_overrides.yaml 文件
          # Melos 3.0+ 使用这些文件管理本地依赖，但发布时必须删除
          echo "Removing pubspec_overrides.yaml files..."
          find . -name "pubspec_overrides.yaml" -type f -delete
      
      - name: Publish Main Package
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false' &&
          github.event.inputs.publish_main == 'true'
        run: |
          MAIN_VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          PUBLISHED=$(curl -s "https://pub.dev/api/packages/flutter_dev_panel" | grep -o '"latest":{"version":"[^"]*' | cut -d'"' -f6 || echo "0.0.0")
          echo "Local: $MAIN_VERSION, pub.dev: $PUBLISHED"

          if [ "$PUBLISHED" != "$MAIN_VERSION" ]; then
            echo "Publishing flutter_dev_panel $MAIN_VERSION..."
            dart pub publish --force
            echo "Waiting for pub.dev to index..."
            sleep 30
          else
            echo "flutter_dev_panel $MAIN_VERSION already published"
          fi

      - name: Publish Sub-packages
        if: |
          (github.event.inputs.action == 'publish' || github.event.inputs.action == 'version-publish') &&
          github.event.inputs.dry_run == 'false'
        run: |
          REPO_ROOT=$(pwd)
          MAIN_VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)

          # Verify main package is available on pub.dev
          MAIN_PUB=$(curl -s "https://pub.dev/api/packages/flutter_dev_panel" | grep -o '"latest":{"version":"[^"]*' | cut -d'"' -f6 || echo "0.0.0")
          echo "Main package on pub.dev: $MAIN_PUB"

          publish_sub() {
            local name=$1
            local selected=$2
            local dir="$REPO_ROOT/packages/$name"

            if [ "$selected" != "true" ]; then
              echo "Skipping $name (not selected)"
              return
            fi

            if [ ! -d "$dir" ]; then
              echo "ERROR: $dir not found"
              return 1
            fi

            local version=$(grep "^version:" "$dir/pubspec.yaml" | cut -d' ' -f2)
            local published=$(curl -s "https://pub.dev/api/packages/$name" | grep -o '"latest":{"version":"[^"]*' | cut -d'"' -f6 || echo "0.0.0")
            echo ""
            echo "=== $name: local=$version, pub.dev=$published ==="

            if [ "$published" = "$version" ]; then
              echo "$name $version already published"
              return
            fi

            # Copy package to a standalone temp directory with its own git repo.
            # dart pub publish uses 'git ls-files' to determine which files to
            # include in the archive. When running from a monorepo subdirectory,
            # the git root differs from the package root, causing an empty archive
            # (<1 KB) and "pubspec is hidden" errors. Publishing from an isolated
            # git repo ensures all package files are correctly included.
            local tmp_dir=$(mktemp -d)
            echo "Copying $name to temp directory: $tmp_dir"
            cp -r "$dir"/. "$tmp_dir/"

            # Replace path dependency with hosted version
            sed "s|flutter_dev_panel:.*|flutter_dev_panel: ^$MAIN_PUB|g" "$tmp_dir/pubspec.yaml" | grep -v "    path:" > "$tmp_dir/pubspec.yaml.tmp"
            mv "$tmp_dir/pubspec.yaml.tmp" "$tmp_dir/pubspec.yaml"

            # Remove pubspec_overrides.yaml if present
            rm -f "$tmp_dir/pubspec_overrides.yaml"

            # Copy LICENSE from repo root
            cp "$REPO_ROOT/LICENSE" "$tmp_dir/LICENSE" 2>/dev/null || true

            echo "Updated pubspec.yaml:"
            grep -A1 "flutter_dev_panel" "$tmp_dir/pubspec.yaml" || true

            # Initialize as standalone git repo so dart pub publish works
            (cd "$tmp_dir" && git init --quiet && git config user.name "ci" && git config user.email "ci@ci" && git add -A && git commit -m "publish" --quiet)

            echo "Publishing $name $version..."
            (cd "$tmp_dir" && dart pub publish --force)
            local exit_code=$?

            # Cleanup temp directory
            rm -rf "$tmp_dir"

            if [ $exit_code -ne 0 ]; then
              echo "FAILED to publish $name"
              return 1
            fi

            echo "$name $version published successfully"
            sleep 5
          }

          publish_sub "flutter_dev_panel_console" "${{ github.event.inputs.publish_console }}"
          publish_sub "flutter_dev_panel_network" "${{ github.event.inputs.publish_network }}"
          publish_sub "flutter_dev_panel_device" "${{ github.event.inputs.publish_device }}"
          publish_sub "flutter_dev_panel_performance" "${{ github.event.inputs.publish_performance }}"

          echo ""
          echo "Publishing process completed!"
      
      # Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## 📊 Melos Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "**Mode:** 🔍 Dry Run (no changes made)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** ✅ Live Run" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.action }}" == *"version"* ]]; then
            echo "### Version Settings" >> $GITHUB_STEP_SUMMARY
            echo "- **Type:** ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Prerelease:** ${{ github.event.inputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Package Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run melos list --long >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "version" ] || [ "${{ github.event.inputs.action }}" == "version-publish" ]; then
            if [ "${{ github.event.inputs.dry_run }}" == "false" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Created Tags" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              git tag --points-at HEAD >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi